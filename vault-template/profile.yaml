name: My Party
spriteOverrides: sprites/overrides

# Name the projects your creatures can work in, then set `cwd:` in a creature.yaml to one of these paths.
# Creatures without a cwd work in this vault.
repos: {}
#  my-app: ~/code/my-app

engines:
  claude:
    adapter: claude
    bin: claude
  gemini:
    adapter: cli
    bin: gemini
    args: ["-p", "{prompt}"]
  # OpenAI Codex CLI, through the generic adapter: each quest is one `codex exec` run with no resumed session.
  codex:
    adapter: cli
    bin: codex
    args: ["exec", "--skip-git-repo-check", "{prompt}"]
  antigravity:
    adapter: antigravity
    bin: agy

guard:
  fullAuto:
    maxMinutes: 45
    maxPlanUsage: 0.85
    worktree: true
    # maxBudgetUsd: 10    # optional: stop an unattended run once its estimated API cost passes this
  alwaysDeny: []
  askBeyondLimits: false  # true: anything a deny list blocks (built-in, these rules or a creature's own) asks you instead of being refused

# Every tool call resends the whole conversation, so long sessions burn tokens fast.
session:
  autocompact: 200000     # compact once the conversation reaches this size (100000-1000000, or auto)
  idleResetMinutes: 60    # after this long idle the prompt cache is cold: start fresh with a short recap instead (0 = never)
  idleResetMinTokens: 120000 # only reset sessions at least this big (a fresh session costs 35-60k by itself)
  lightModel: sonnet      # creatures answering a teammate, and short lookups on the Auto model, run on this ('' = off)

# Watches your own Claude Code terminal sessions and nudges you when one gets expensive.
watch:
  terminalSessions: true
  largeTokens: 300000     # a session this big is flagged, and you can adopt it into a creature thread
  notify: true

daycare:
  mode: free            # free | ai | off
  autoApproveFullAuto: false
