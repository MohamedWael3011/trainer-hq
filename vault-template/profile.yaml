name: My Party
spriteOverrides: sprites/overrides

# Name the projects your creatures can work in, then set `cwd:` in a creature.yaml to one of these paths.
# Creatures without a cwd work in this vault.
repos: {}
#  my-app: ~/code/my-app

engines:
  claude:
    adapter: claude
    bin: claude
  gemini:
    adapter: cli
    bin: gemini
    args: ["-p", "{prompt}"]
  antigravity:
    adapter: antigravity
    bin: agy

guard:
  fullAuto:
    maxMinutes: 45
    maxPlanUsage: 0.85
    worktree: true
    # maxBudgetUsd: 10    # optional: stop an unattended run once its estimated API cost passes this
  alwaysDeny: []
  askBeyondLimits: false  # true: anything a deny list blocks (built-in, these rules or a creature's own) asks you instead of being refused

# Every tool call resends the whole conversation, so long sessions burn tokens fast.
session:
  autocompact: 200000     # compact once the conversation reaches this size (100000-1000000, or auto)
  idleResetMinutes: 60    # after this long idle the prompt cache is cold: start fresh with a short recap instead (0 = never)
  idleResetMinTokens: 40000  # only reset sessions at least this big

daycare:
  mode: free            # free | ai | off
  autoApproveFullAuto: false
